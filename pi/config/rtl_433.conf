# rtl_433 flex-decoder database for devices reverse-engineered on this
# testbench. Installed to /etc/rtl_433/rtl_433.conf, which rtl_433 auto-loads,
# so devices listed here are recognised by name in every decode.
#
# Add new devices with the "AI Sherlock" record→analyse flow, then append a
# `decoder` line here (one per distinct code; use match={<bits>}<hex>).
# Verify offline, with no dongle and no transmitter, using:
#
#     rtl_433 -y '{<bits>}<hex>'
#
# Ships empty on purpose. The decoders that belong here describe *your*
# hardware — a remote, a sensor, a TPMS transmitter — and one household's
# remote is of no use on anybody else's bench.
#
# ── Worked example ───────────────────────────────────────────────────
#
# A four-button 433.92 MHz OOK-PWM remote, 18 bits, device id 0x7F4 in the
# high bits, buttons differing only in the low command bits. Short pulse
# 340 us reads as '1', long 2068 us as '0', 13.9 ms gap resets the frame,
# and a press repeats about eleven times.
#
# decoder n=Remote-up,m=OOK_PWM,s=340,l=2068,r=13936,g=2000,t=691,match={18}7f454
# decoder n=Remote-down,m=OOK_PWM,s=340,l=2068,r=13936,g=2000,t=691,match={18}7f45c
# decoder n=Remote-auto,m=OOK_PWM,s=340,l=2068,r=13936,g=2000,t=691,match={18}7f480
# decoder n=Remote-manual,m=OOK_PWM,s=340,l=2068,r=13936,g=2000,t=691,match={18}7f484
#
# The parameters are what `acquire` measures for you: m= modulation,
# s=/l= short and long pulse widths in us, r= reset gap, g= gap limit,
# t= pulse tolerance, match= the bit pattern that identifies this device.
