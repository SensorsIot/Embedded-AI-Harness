## Managed component dependencies.
##
## cJSON shipped inside ESP-IDF as the `json` component up to v5.x. ESP-IDF 6
## removed it from the tree, so it is now pulled from the component registry.
## esp-mqtt left the tree in the same release: `REQUIRES mqtt` resolves to
## "unknown component" on v6, so the client comes from the registry too.
dependencies:
  espressif/cjson: "^1.7.18"
  espressif/mqtt: "^1.0.0"
